# Plan morning-digest § 3 and § 4: save /digest/2026-10-28 as one HTML file and put it on Pages.
# The page is built here and deployed as a Pages artifact, so it never lands in git (ADR 0003).
# The marker comes from the LANE_MARKER secret; run with `marker: false` to upload over it clean.
name: preview

on:
  workflow_dispatch:
    inputs:
      marker:
        description: Show the lane marker in the banner
        type: boolean
        default: true

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  preview:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: npm i -g pnpm@10 && pnpm install --no-frozen-lockfile
      - name: Save /digest/2026-10-28
        env:
          LANE_MARKER: ${{ inputs.marker && secrets.LANE_MARKER || '' }}
          PORT: 8787
        run: |
          pnpm start > rig.log 2>&1 &
          for i in $(seq 30); do curl -fs localhost:8787/health && break; sleep 1; done
          mkdir -p _site
          curl -fsS localhost:8787/digest/2026-10-28 -o _site/index.html
          if [ -n "$LANE_MARKER" ]; then grep -q "$LANE_MARKER" _site/index.html; else grep -q 'no marker set' _site/index.html; fi
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
          retention-days: 1
      - id: deploy
        uses: actions/deploy-pages@v4
